services:
  - type: web
    name: journey360-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        fromGroup: journey360-secrets
      - key: FIREBASE_CREDENTIALS
        fromGroup: journey360-secrets
      - key: GEMINI_API_KEY
        fromGroup: journey360-secrets
